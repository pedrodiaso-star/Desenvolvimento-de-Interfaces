<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Calculadora JavaScript</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="container">
 <h1>Calculadora</h1>
 <label for="nota1">Primeiro número:</label>
 <input type="number" id="nota1" placeholder="Digite um número">
 <label for="nota2">Segundo número:</label>
 <input type="number" id="nota2" placeholder="Digite um número">
 <label for="nota3">Terceira número:</label>
 <input type="number" id="nota3" placeholder="Digite um número">
 <button id="btnCalcular">Calcular</button>
 <section id="resultado" aria-live="polite">
 Os resultados aparecerão aqui.
 </section>
 </main>
 <script src="script.js"></script>
</body>
</html>

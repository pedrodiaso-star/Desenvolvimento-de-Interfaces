<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport"
 content="width=device-width, initial-scale=1.0">
 <title>Calculadora de Média</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="container">
 <h1>Calculadora de Média</h1>
 <p>Informe o nome e as três notas.</p>
 <form id="formulario-media">
 <label for="nome">Nome do estudante</label>
 <input type="text" id="nome"
 placeholder="Ex.: Mariana Silva">
 <label for="nota1">Primeira nota</label>
 <input type="number" id="nota1"
 min="0" max="10" step="0.1">
 <label for="nota2">Segunda nota</label>
 <input type="number" id="nota2"
 min="0" max="10" step="0.1">
 <label for="nota3">Terceira nota</label>
 <input type="number" id="nota3"
 min="0" max="10" step="0.1">
 <button type="submit">Calcular média</button>
 <button type="reset" id="limpar">Limpar</button>
 </form>
 <section id="resultado" class="resultado"
 aria-live="polite">
 </section>
 </main>
 <script src="script.js"></script>
</body>
</html>
